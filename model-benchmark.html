<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tastemake Model Benchmark</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.45}
button{font:inherit;padding:10px 14px;cursor:pointer}
pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:10px;overflow:auto}
.status{font-weight:700;margin:16px 0}
</style>
</head>
<body>
<h1>Tastemake model benchmark</h1>
<p>Preview-only. This runs the same five recommendation eval fixtures against Sonnet 5, Sonnet 5.5 low effort, and Haiku 4.5.</p>
<button id="run">Run benchmark</button>
<div class="status" id="status">Ready.</div>
<pre id="out"></pre>
<script>
const configs=["sonnet5","sonnet55low","haiku45"];
const labels={sonnet5:"Sonnet 5",sonnet55low:"Sonnet 5.5 low",haiku45:"Haiku 4.5"};
const run=async()=>{
  const btn=document.querySelector("#run"),status=document.querySelector("#status"),out=document.querySelector("#out");
  btn.disabled=true; out.textContent="";
  try{
    for(let i=0;i<configs.length;i++){
      const key=configs[i];
      status.textContent=`Running ${labels[key]} (${i+1}/${configs.length})…`;
      const res=await fetch(`/api/model-benchmark?config=${key}`,{cache:"no-store"});
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||`HTTP ${res.status}`);
      out.textContent += labels[key]+"\n"+JSON.stringify(data.summary,null,2)+"\n\n";
    }
    status.textContent="Done. You can close this tab.";
  }catch(err){
    status.textContent="Benchmark stopped: "+err.message;
  }finally{btn.disabled=false;}
};
document.querySelector("#run").addEventListener("click",run);
</script>
</body>
</html>
