name: ai-eval

# EVAL BRANCH ONLY (Nov 13, #311): replaces this branch's ai-eval workflow with the quality-floor
# before/after (scripts/evals/quality-floor-run.mjs). Dispatch on eval/311-before and eval/311-after.
# PAID: at most max_calls claude-haiku-5-5 calls and max_usd per arm, enforced in the script before
# every call. Needs the ANTHROPIC_API_KEY and TASTEMAKE_TMDB_TOKEN repository secrets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Arm name (before or after)
        default: arm
      max_calls:
        description: Refuse any model call past this many
        default: "12"
      max_usd:
        description: Spend cap; each call's worst case is checked against it
        default: "0.025"

concurrency:
  group: ai-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Plan (no model calls)
        run: node scripts/evals/quality-floor-run.mjs --dry-run
      - name: Run the quality-floor eval (PAID)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASTEMAKE_TMDB_TOKEN: ${{ secrets.TASTEMAKE_TMDB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MAX_CALLS: ${{ inputs.max_calls }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          set -euo pipefail
          node scripts/evals/quality-floor-run.mjs --yes --tag "$TAG" --max-calls "$MAX_CALLS" --max-usd "$MAX_USD" --out quality-floor-results 2>&1 | grep -v '^\[tastemake-' 
      - name: Summary
        if: always()
        run: |
          shopt -s nullglob
          for f in quality-floor-results/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-floor-${{ inputs.tag }}
          path: quality-floor-results/
          if-no-files-found: ignore
