name: test

permissions:
  contents: read
  pull-requests: write

# The required automated gate (#41). Runs on every push and PR: the three no-browser suites
# (endpoint contract, escaping, async request state), one look's model/flow/layout/a11y checks,
# and the free deterministic eval. No dependencies to install (this project has none), no build
# step, and no model call — this workflow never spends money.
#
# The full multi-look, multi-width sweep (`npm run test:full`) and the paid live-model eval
# (`npm run test:eval:endpoint`) are NOT run here; they stay manual (see docs/ai-evals.md and
# docs/HANDOFF.md).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chrome (for the headless browser suites)
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: npm test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test

      - name: Paid direct model eval (AFTER #130)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASTEMAKE_AI_MODEL: claude-sonnet-5
        run: node scripts/evals/context-after-direct.mjs | tee /tmp/after-eval.txt

      - name: Post after-eval metrics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'After-context direct eval output:'
            echo '```json'
            cat /tmp/after-eval.txt 2>/dev/null || true
            echo '```'
          } > /tmp/after-comment.md
          gh pr comment 133 --body-file /tmp/after-comment.md
