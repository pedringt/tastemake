<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tastemake prototype: recommendations that get better as you react." />
    <title>Tastemake Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/favorites.css" />
    <link rel="stylesheet" href="/styles/profile.css" />
    <link rel="stylesheet" href="/styles/recommendations.css" />
    <link rel="stylesheet" href="/styles/bookmarks.css" />
    <link rel="stylesheet" href="/styles/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-cluster">
          <a class="brand" href="/favorites" data-step-jump="favorites" aria-label="Go to Tastemake favorites">
            <span class="brand-word">Tastemake</span>
            <span class="brand-zap" aria-hidden="true">*</span>
          </a>
          <span class="brand-tagline">recommendations that<br />get better as you react.</span>
        </div>

        <nav class="stepper" aria-label="Tastemake sections">
          <a class="step" href="/favorites" data-step-jump="favorites"><span aria-hidden="true">01</span>Favorites</a>
          <a class="step" href="/recommendations" data-step-jump="recommendations"><span aria-hidden="true">02</span>Recommendations</a>
          <a class="step" href="/taste-profile" data-step-jump="model"><span aria-hidden="true">03</span>Taste Profile</a>
          <a class="step" href="/bookmarks" data-step-jump="bookmarks" hidden><span aria-hidden="true">04</span>Bookmarks<span class="step-count" data-bookmark-count></span></a>
        </nav>

        <div class="topbar-aside">
          <span class="prototype-label">Prototype - no live AI</span>
          <span class="topbar-note">good taste lives here.</span>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
      <div id="live" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
